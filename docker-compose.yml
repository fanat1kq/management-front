version: '3.8'

services:
  taskflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow
    ports:
      - "3002:3002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3